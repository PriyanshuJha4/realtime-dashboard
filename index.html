<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --danger: #f43f5e;
            --border: #334155;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
        }
        header {
            margin-bottom: 1.5rem;
        }
        h1 {
            font-size: 1.5rem;
            margin: 0 0 0.5rem 0;
        }
        #status {
            font-size: 0.875rem;
            color: var(--text-muted);
        }
        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        input[type="text"] {
            flex: 1;
            padding: 0.75rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            color: var(--text-color);
            font-size: 1rem;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }
        button {
            padding: 0.75rem 1.25rem;
            background-color: var(--accent);
            color: #000;
            border: none;
            border-radius: 0.375rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            opacity: 0.9;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 0.375rem;
        }
        .delete-btn {
            background: transparent;
            color: var(--danger);
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
        }
        .delete-btn:hover {
            background-color: rgba(244, 63, 94, 0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Realtime Dashboard</h1>
            <div id="status">Connecting...</div>
        </header>

        <form id="task-form" class="input-group">
            <input type="text" id="task-input" placeholder="Add a new task..." required autocomplete="off">
            <button type="submit">Add</button>
        </form>

        <ul id="task-list"></ul>
    </div>

    <script>
        const SUPABASE_URL = "https://gvztplkvkxfuirqspeaj.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2enRwbGt2a3hmdWlycXNwZWFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NDY5NjAsImV4cCI6MjEwNjAyMjk2MH0.ygl-xx3_eXoND9kA82mc_FvmbQEQiHYwhGybquhvKRc";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const statusEl = document.getElementById('status');
        const taskForm = document.getElementById('task-form');
        const taskInput = document.getElementById('task-input');
        const taskList = document.getElementById('task-list');

        async function fetchTasks() {
            const { data, error } = await supabaseClient
                .from('tasks')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error fetching tasks:', error);
                statusEl.textContent = 'Error loading tasks';
                return;
            }

            renderTasks(data);
            statusEl.textContent = 'Live — synced in real time.';
        }

        function renderTasks(tasks) {
            taskList.innerHTML = '';
            tasks.forEach(task => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>${escapeHtml(task.title)}</span>
                    <button class="delete-btn" onclick="deleteTask('${task.id}')">Delete</button>
                `;
                taskList.appendChild(li);
            });
        }

        taskForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = taskInput.value.trim();
            if (!title) return;

            const { error } = await supabaseClient
                .from('tasks')
                .insert([{ title }]);

            if (error) {
                console.error('Error adding task:', error);
            } else {
                taskInput.value = '';
            }
        });

        async function deleteTask(id) {
            const { error } = await supabaseClient
                .from('tasks')
                .delete()
                .eq('id', id);

            if (error) {
                console.error('Error deleting task:', error);
            }
        }

        function subscribeToChanges() {
            supabaseClient
                .channel('public:tasks')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, () => {
                    fetchTasks();
                })
                .subscribe();
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        fetchTasks();
        subscribeToChanges();
    </script>
</body>
</html>
